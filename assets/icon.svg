<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2812"/>
      <stop offset="1" stop-color="#0b0e08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ffb0" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#c8ff4d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7bd92a" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="sweep" x1="120" y1="360" x2="400" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd426"/>
      <stop offset=".55" stop-color="#c8ff4d"/>
      <stop offset="1" stop-color="#f0ffc0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ffd6"/>
      <stop offset="1" stop-color="#b9f14a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".42" cy=".62" r=".62">
      <stop offset="0" stop-color="#c8ff4d" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c8ff4d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="120"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
    <!-- 一道扫过的弧线：代表"清理"动作 -->
    <path d="M116 346 C116 226 224 128 344 128" fill="none" stroke="#c8ff4d" stroke-opacity=".22"
          stroke-width="30" stroke-linecap="round"/>
    <path d="M128 358 C128 238 236 140 356 140" fill="none" stroke="url(#sweep)"
          stroke-width="46" stroke-linecap="round"/>
    <path d="M152 384 C152 288 232 204 332 192" fill="none" stroke="#eaffab" stroke-opacity=".55"
          stroke-width="12" stroke-linecap="round"/>
    <!-- 三颗闪星 -->
    <g fill="url(#spark)">
      <path transform="translate(352,318) scale(52)" d="M0 -1 C.12 -.3 .3 -.12 1 0 C.3 .12 .12 .3 0 1 C-.12 .3 -.3 .12 -1 0 C-.3 -.12 -.12 -.3 0 -1 Z"/>
      <path transform="translate(238,392) scale(30)" d="M0 -1 C.12 -.3 .3 -.12 1 0 C.3 .12 .12 .3 0 1 C-.12 .3 -.3 .12 -1 0 C-.3 -.12 -.12 -.3 0 -1 Z"/>
      <path transform="translate(398,214) scale(24)" d="M0 -1 C.12 -.3 .3 -.12 1 0 C.3 .12 .12 .3 0 1 C-.12 .3 -.3 .12 -1 0 C-.3 -.12 -.12 -.3 0 -1 Z"/>
    </g>
    <!-- 顶部斜向高光，营造玻璃质感 -->
    <path d="M16 16 H496 V150 C340 236 172 232 16 176 Z" fill="#ffffff" opacity=".05"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="118.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
